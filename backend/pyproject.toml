[project]
name = "web-vuln-scanner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "dnspython>=2.9.0",
    "fastapi>=0.162.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sqlalchemy>=2.1.6",
    "sslyze>=6.3.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
