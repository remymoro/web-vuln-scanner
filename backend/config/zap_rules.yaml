# Règles passives de ZAP exclues car déjà couvertes par le scanner headers.
# ZAP 2.16 n'a pas de règle passive dédiée à l'absence de Referrer-Policy.
- plugin_id: "10010"
  name: Cookie No HttpOnly Flag
  covered_by: headers.cookie.httponly

- plugin_id: "10011"
  name: Cookie Without Secure Flag
  covered_by: headers.cookie.secure

- plugin_id: "10021"
  name: X-Content-Type-Options Header Missing
  covered_by: headers.x_content_type_options

- plugin_id: "10035"
  name: Strict-Transport-Security Header Not Set
  covered_by: headers.hsts

- plugin_id: "10038"
  name: Content Security Policy (CSP) Header Not Set
  covered_by: headers.csp

- plugin_id: "10054"
  name: Cookie without SameSite Attribute
  covered_by: headers.cookie.samesite

- plugin_id: "10055"
  name: CSP
  covered_by: headers.csp

- plugin_id: "10063"
  name: Permissions Policy Header Not Set
  covered_by: headers.permissions_policy
