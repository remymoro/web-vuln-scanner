server {
    listen 443 ssl;
    server_name demo.scanner.test;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;

    # Démo volontairement faible : TLS 1.1. 3DES est demandé, mais l'OpenSSL de cette
    # image ne le propose plus : seul TLS 1.1 ressort au scan.
    # SECLEVEL=0 autorise les anciennes signatures nécessaires à TLS 1.1.
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE+AESGCM:ECDHE+AES:RSA+AES:DES-CBC3-SHA:@SECLEVEL=0';

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'" always;
    add_header Set-Cookie "demo=session; Path=/" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
