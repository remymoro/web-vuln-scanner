name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 10
    # Même base que docker-compose.test.yml, pour les tests qui touchent PostgreSQL.
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner
          POSTGRES_DB: scanner_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scanner -d scanner_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7.4.6-alpine3.21
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --tag web-vuln-scanner-backend:ci ./backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
